<script>
/* Mostra qualquer erro de JavaScript na tela (sem precisar abrir o console) */
window.addEventListener('error', function(e){
  try{
    var tag = document.getElementById('syncTag');
    if(tag) tag.textContent = 'Erro: ' + e.message;
    console.error('Erro capturado:', e.message, e.filename, e.lineno);
  }catch(_){}
});
</script>

:root{
  --bg:#EEF1EC; --panel:#FFFFFF; --ink:#16241E; --ink-soft:#5B6B62;
  --line:#DDE4DA; --forest:#16332B; --forest-2:#1F4A3B; --amber:#D98E2B;
  --amber-ink:#5C3B0C; --danger:#B3452F;
  --font:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0E1512; --panel:#182119; --ink:#E7EEE9; --ink-soft:#9DB0A6;
    --line:#283329; --forest:#0B1610; --forest-2:#15271E; --amber:#E8A33D; --amber-ink:#2A1B04;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1512; --panel:#182119; --ink:#E7EEE9; --ink-soft:#9DB0A6;
  --line:#283329; --forest:#0B1610; --forest-2:#15271E; --amber:#E8A33D; --amber-ink:#2A1B04;
}

*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{font-family:var(--font);background:var(--bg);color:var(--ink);overflow:hidden;}

#map{position:absolute;inset:0;background:var(--bg);}

/* ---- floating filter panel, right side (agora com o cabeçalho da marca embutido) ---- */
#panel{
  position:absolute; top:16px; right:16px; bottom:16px; z-index:900;
  width:322px; max-width:calc(100vw - 32px);
  background:var(--panel); border-radius:14px;
  box-shadow:0 10px 30px rgba(0,0,0,0.20);
  border:1px solid var(--line);
  display:flex; flex-direction:column; overflow:hidden;
}
#panel .panel-head{
  padding:14px 16px 12px; border-bottom:1px solid var(--line); flex-shrink:0;
  background:var(--forest); color:#EFF5F1; border-bottom:3px solid var(--amber);
}
#panel .panel-head .row1{display:flex; align-items:flex-start; gap:8px; margin-bottom:8px;}
.title-block{flex:1; min-width:0;}
.title-block h1{font-size:14.5px; margin:0; font-weight:600; letter-spacing:.01em;}
.title-block .sub{font-size:11px; color:#BBCDC2; margin-top:2px;}
.view-toggle-btn{
  width:28px; height:28px; border-radius:8px; border:1px solid rgba(255,255,255,0.25);
  background:transparent; color:#EFF5F1; font-size:13px; cursor:pointer; flex-shrink:0;
  display:flex; align-items:center; justify-content:center;
}
.view-toggle-btn:hover{border-color:var(--amber);}
#panel .panel-head .row2{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.count{
  font-family:'IBM Plex Mono',monospace; font-size:11px;
  background:rgba(255,255,255,0.09); border:1px solid rgba(255,255,255,0.2);
  display:inline-block; padding:3px 9px; border-radius:999px; flex-shrink:0;
}
.synctag{font-size:10px; color:#9FC2AE; display:flex; align-items:center; gap:6px; min-width:0;}
.synctag span{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
#refreshBtn{
  background:transparent; border:1px solid rgba(255,255,255,0.25); color:#9FC2AE;
  width:16px; height:16px; border-radius:50%; font-size:10px; line-height:1;
  cursor:pointer; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;
}
#refreshBtn:hover{border-color:var(--amber); color:var(--amber);}
#refreshBtn.spinning{animation:spin 0.8s linear infinite;}
@keyframes spin{ from{transform:rotate(0deg);} to{transform:rotate(360deg);} }
#panel .panel-head h2{margin:0 0 10px; font-size:13px; font-weight:600; color:#BBCDC2; text-transform:uppercase; letter-spacing:.03em;}

.add-btn{
  width:34px; height:34px; border-radius:10px; border:none; cursor:pointer;
  background:var(--amber); color:#2A1B04; font-size:19px; line-height:1;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
  box-shadow:0 2px 6px rgba(217,142,43,0.4);
}
.add-btn:hover{filter:brightness(1.06);}

#panel .panel-foot{
  display:flex; align-items:center; gap:10px;
  padding:12px 16px; border-top:1px solid var(--line); flex-shrink:0;
}
#panel .panel-foot .clear-btn{margin-top:0; flex:1;}

.search-wrap{position:relative;}
.search-wrap input{
  width:100%; padding:9px 12px 9px 32px; border-radius:9px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:13px;
}
.search-wrap input:focus{outline:2px solid var(--amber); outline-offset:1px;}
.search-wrap svg{position:absolute; left:10px; top:50%; transform:translateY(-50%); opacity:.55;}

#panel .panel-body{flex:1; overflow-y:auto; padding:6px 16px 16px;}
#panel .panel-body::-webkit-scrollbar{width:8px;}
#panel .panel-body::-webkit-scrollbar-thumb{background:var(--line); border-radius:8px;}

details.group{border-bottom:1px solid var(--line); padding:10px 0;}
details.group:last-of-type{border-bottom:none;}
details.group summary{cursor:pointer; list-style:none; display:flex; align-items:center; gap:6px; font-size:12.5px; font-weight:600; color:var(--ink-soft);}
details.group summary::-webkit-details-marker{display:none;}
details.group summary .chev{transition:transform .15s ease; font-size:10px; color:var(--ink-soft);}
details.group[open] summary .chev{transform:rotate(90deg);}
details.group summary .gcount{margin-left:auto; font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}

.opt-list{display:flex; flex-direction:column; gap:1px; margin-top:8px;}
.opt{display:flex; align-items:center; gap:9px; padding:6px 6px; border-radius:7px; cursor:pointer; font-size:13px; line-height:1.3; user-select:none;}
.opt:hover{background:var(--bg);}
.opt input{width:15px; height:15px; accent-color:var(--forest-2); flex-shrink:0;}
.opt .swatch{width:11px; height:11px; border-radius:3px; flex-shrink:0; border:1px solid rgba(0,0,0,0.15);}
.opt .swatch.round{border-radius:50%;}
.opt .label{flex:1;}
.opt .n{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--ink-soft);}
.opt.disabled{opacity:.35; pointer-events:none;}

.clear-btn{
  width:100%; padding:9px 10px; background:transparent; border:1px solid var(--line);
  color:var(--ink-soft); border-radius:8px; font-family:var(--font); font-size:12.5px;
  cursor:pointer; margin-top:8px;
}
.clear-btn:hover{border-color:var(--amber); color:var(--amber-ink);}
:root[data-theme="dark"] .clear-btn:hover, :root:not([data-theme="light"]) .clear-btn:hover{color:var(--amber);}

/* ---- map elements ---- */
.eco-pin{
  width:32px; height:32px; border-radius:50%;
  background:#1F9D55;
  border:2px solid rgba(255,255,255,0.9);
  box-shadow:0 2px 6px rgba(0,0,0,0.4);
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:19px; line-height:1; font-family:Arial, sans-serif;
}
.eco-pin.pending{border-style:dashed; border-color:#fff;}

.leaflet-popup-content-wrapper{background:var(--panel); color:var(--ink); border-radius:12px;}
.leaflet-popup-tip{background:var(--panel);}
.popup{min-width:210px;}
.popup-photo-wrap{margin:-1px -1px 8px; border-radius:11px 11px 0 0; overflow:hidden;}
.popup-photo{width:100%; height:120px; object-fit:cover; display:block; background:var(--bg);}
.popup h3{margin:0 0 4px; font-size:14px; font-weight:600;}
.popup .meta{font-size:12px; color:var(--ink-soft); margin:2px 0;}
.popup .tags{display:flex; flex-wrap:wrap; gap:4px; margin-top:7px;}
.popup .tag{font-size:10.5px; padding:2px 7px; border-radius:999px; color:#fff; font-weight:500;}
.popup .routes{display:flex; gap:7px; margin-top:11px; padding-top:10px; border-top:1px solid var(--line);}
.popup .routes a{flex:1; display:flex; align-items:center; justify-content:center; gap:5px; padding:7px 8px; border-radius:8px; font-size:12px; font-weight:600; text-decoration:none; border:1px solid var(--line); color:var(--ink);}
.popup .routes a.gmaps{background:#1F4A3B; color:#fff; border-color:#1F4A3B;}
.popup .routes a.waze{background:#EAF3FF; color:#0B5FCB; border-color:#BFDBFF;}
:root[data-theme="dark"] .popup .routes a.waze, :root:not([data-theme="light"]) .popup .routes a.waze{background:#12253F; color:#7FB2FF; border-color:#1E3A5C;}

.muni-label-tt{background:transparent!important;border:none!important;box-shadow:none!important;padding:0!important;}
.muni-label-tt::before{display:none;}
.muni-label-tt{font-family:var(--font);font-size:12px;font-weight:700;color:#2A362F;
text-shadow:0 1px 0 rgba(255,255,255,.9),0 -1px 0 rgba(255,255,255,.9),1px 0 0 rgba(255,255,255,.9),-1px 0 0 rgba(255,255,255,.9);}

/* ---- modal ---- */
.modal-backdrop{
  position:fixed; inset:0; background:rgba(10,15,12,0.55); z-index:2000;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.modal-card{
  width:100%; max-width:420px; max-height:88vh; overflow-y:auto;
  background:var(--panel); border-radius:16px; box-shadow:0 20px 50px rgba(0,0,0,0.35);
  padding:22px 22px 20px;
}
.modal-card h3{margin:0 0 4px; font-size:16.5px; font-weight:700;}
.modal-card .modal-sub{font-size:12.5px; color:var(--ink-soft); margin-bottom:16px;}
.field{margin-bottom:12px;}
.field label{display:block; font-size:12px; font-weight:600; color:var(--ink-soft); margin-bottom:4px;}
.field input, .field textarea{
  width:100%; padding:9px 11px; border-radius:8px; border:1px solid var(--line);
  background:var(--bg); color:var(--ink); font-family:var(--font); font-size:13.5px;
}
.field input:focus, .field textarea:focus{outline:2px solid var(--amber); outline-offset:1px;}
.field .hint{font-size:11px; color:var(--ink-soft); margin-top:3px;}
.field-row{display:flex; gap:10px;}
.field-row .field{flex:1;}
.modal-actions{display:flex; gap:10px; margin-top:16px;}
.btn{
  flex:1; padding:10px 12px; border-radius:9px; border:none; cursor:pointer;
  font-family:var(--font); font-size:13.5px; font-weight:600;
}
.btn.primary{background:var(--forest); color:#EFF5F1;}
.btn.primary:hover{background:var(--forest-2);}
.btn.ghost{background:transparent; border:1px solid var(--line); color:var(--ink-soft);}
.btn.ghost:hover{border-color:var(--amber); color:var(--amber-ink);}
.error-msg{color:var(--danger); font-size:12.5px; margin-top:6px; min-height:16px;}
.warn-box{
  background:rgba(217,142,43,0.12); border:1px solid rgba(217,142,43,0.4);
  color:var(--amber-ink); font-size:11.5px; padding:8px 10px; border-radius:8px; margin-top:10px;
}
:root[data-theme="dark"] .warn-box, :root:not([data-theme="light"]) .warn-box{color:var(--amber);}

.toast{
  position:fixed; bottom:22px; left:50%; transform:translateX(-50%);
  background:var(--forest); color:#EFF5F1; padding:11px 18px; border-radius:10px;
  font-size:13px; box-shadow:0 8px 24px rgba(0,0,0,0.3); z-index:2500;
  opacity:0; pointer-events:none; transition:opacity .25s ease, transform .25s ease;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

@media (max-width:820px){
  #panel{top:auto; bottom:0; right:0; left:0; width:auto; max-height:46vh; border-radius:16px 16px 0 0;}
}
/* Layout forçado pelo botão 🖥️/📱, independente da largura real da tela */
body.force-mobile #panel{top:auto !important; bottom:0 !important; right:0 !important; left:0 !important; width:auto !important; max-height:46vh !important; border-radius:16px 16px 0 0 !important;}
body.force-desktop #panel{top:16px !important; bottom:16px !important; right:16px !important; left:auto !important; width:322px !important; max-height:none !important; border-radius:14px !important;}
</style>
</head>

const CATS = [
  ["Eletrônicos / E-lixo", ["eletrôn","eletron","e-lixo","elixo","computador","perifer","monitor","gabinete","peças de ti","sucata eletr"]],
  ["Pilhas e Baterias", ["pilha","bateria"]],
  ["Recicláveis", ["reciclá","reciclav","papel","plástico","plastico","metal","seco"]],
  ["Eletrodomésticos", ["eletrodomé","eletrodome"]],
  ["Óleo de Cozinha/Vegetal", ["óleo","oleo"]],
  ["Entulho / Volumosos", ["entulho","volumos"]],
  ["Móveis", ["móve","move"]],
  ["Podas", ["poda"]],
  ["Lâmpadas", ["lâmpada","lampada"]],
  ["Agendamento / Recepção", ["agendamento","recepção","recepcao"]],
];
function classify(text){
  if(!text) return []; // sem dado de tipo de resíduo — não inventa categoria
  const t = normalize(text);
  const out = [];
  CATS.forEach(([label, kws])=>{ if(kws.some(k=>t.includes(normalize(k)))) out.push(label); });
  return out.length ? out : ["Outros"];
}
// Escapa texto vindo da planilha antes de pôr no HTML (evita injeção de script).
function esc(s){
  return (s==null?'':String(s)).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function normalize(s){ return (s||'').toString().toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,''); }

function cell(v){ return v==null ? '' : v.toString().trim(); }

// Lê "lat, lon" (ex.: "-3.8647, -38.5681") de uma célula da planilha.
function parseCoordCell(text){
  if(!text) return null;
  const m = text.match(/(-?\d+\.?\d*)\s*,\s*(-?\d+\.?\d*)/);
  if(!m) return null;
  const lat = parseFloat(m[1]), lon = parseFloat(m[2]);
  return (isNaN(lat) || isNaN(lon)) ? null : [lat, lon];
}

// Acha a coluna de coordenadas mesmo que o nome exato do cabeçalho mude
// (ex.: "Coordenadas Geográficas (Lat,Long)" virar só "Coordenadas Geográficas").
function findCoordRaw(r){
  if(r["Coordenadas Geográficas (Lat,Long)"]) return r["Coordenadas Geográficas (Lat,Long)"];
  const key = Object.keys(r).find(k => normalize(k).includes('coorden'));
  return key ? r[key] : '';
}
function findFotoRaw(r){
  const key = Object.keys(r).find(k => {
    const n = normalize(k);
    return n.includes('foto') || n.includes('imagem') || n.includes('photo');
  });
  return key ? r[key] : '';
}
// Converte um link de compartilhamento do Google Drive (várias formas possíveis)
// numa URL de imagem exibível. O arquivo precisa estar com o compartilhamento
// em "Qualquer pessoa com o link pode visualizar", senão a foto não carrega.
function driveThumb(url){
  if(!url) return '';
  const m = url.match(/[-\w]{20,}/);
  if(!m) return '';
  return HTTPS + `drive.google.com/thumbnail?id=${m[0]}&sz=w600`;
}

function rowsToPoints(rows){
  return rows
    .filter(r => normalize(cell(r["__status"])) !== 'desativado')
    .map(r=>{
      const municipio = cell(r["Município"]);
      const bairro = cell(r["Bairro"]);
      const tiposRaw = cell(r["Tipo de Resíduo / Detalhes"]);
      // Preferência: coordenada real da planilha; se faltar, cai para a
      // aproximação por bairro/município (útil pra pontos cadastrados sem lat/lon).
      const coord = parseCoordCell(findCoordRaw(r)) || lookupCoord(municipio, bairro);
      return {
        municipio, bairro,
        nome: cell(r["Nome do Local / Ponto"]),
        endereco: cell(r["Endereço / Referência"]),
        tipos_raw: tiposRaw,
        tipos: classify(tiposRaw),
        horario: cell(r["Horário de Funcionamento / Observações"]),
        foto: cell(findFotoRaw(r)),
        lat: coord ? coord[0] : null,
        lon: coord ? coord[1] : null,
      };
    });
}

function lookupCoord(municipio, bairro){
  const hit = BAIRRO_COORDS.find(b=>b.municipio===municipio && b.bairro===bairro);
  if(hit) return [hit.lat, hit.lon];
  if(municipioCentroids[municipio]) return municipioCentroids[municipio];
  return null;
}

let POINTS = SNAPSHOT_POINTS.map(p=>({...p})); // usado até a planilha ao vivo carregar (ou se a busca falhar)

const state = { municipio:new Set(), bairro:new Set(), tipo:new Set(), q:'' };

function matches(p, ignore){
  const okM = ignore==='municipio' || state.municipio.size===0 || state.municipio.has(p.municipio);
  const okB = ignore==='bairro' || state.bairro.size===0 || state.bairro.has(p.bairro);
  const okT = ignore==='tipo' || state.tipo.size===0 || p.tipos.some(t=>state.tipo.has(t));
  const okQ = !state.q || [p.nome,p.bairro,p.municipio,p.endereco].some(v=>normalize(v).includes(state.q));
  return okM && okB && okT && okQ;
}
function currentFiltered(){ return POINTS.filter(p=>matches(p,null)); }

function optionsFor(dimension){
  const pool = POINTS.filter(p=>matches(p,dimension));
  const counts = new Map();
  pool.forEach(p=>{
    const vals = dimension==='tipo' ? p.tipos : [p[dimension]];
    vals.forEach(v=>counts.set(v,(counts.get(v)||0)+1));
  });
  return counts;
}
function swatchFor(dimension, val){
  if(dimension==='tipo') return `<span class="swatch round" style="background:${CAT_COLORS[val]||'#888'}"></span>`;
  if(dimension==='municipio') return `<span class="swatch" style="background:${(MUNI_COLORS[val]||{}).fill||'#ccc'};border-color:${(MUNI_COLORS[val]||{}).stroke||'#999'}"></span>`;
  return '';
}
function renderGroup(dimension, containerId, countId, allValuesSorted){
  const el = document.getElementById(containerId);
  const counts = optionsFor(dimension);
  const selected = state[dimension];
  [...selected].forEach(v=>{ if(!counts.has(v)) selected.delete(v); });
  el.innerHTML = '';
  allValuesSorted.forEach(val=>{
    const n = counts.get(val) || 0;
    const disabled = n===0 && !selected.has(val);
    const row = document.createElement('label');
    row.className = 'opt' + (disabled ? ' disabled':'');
    row.innerHTML = `
      <input type="checkbox" ${selected.has(val)?'checked':''} ${disabled?'disabled':''}>
      ${swatchFor(dimension, val)}
      <span class="label">${esc(val)}</span>
      <span class="n">${n}</span>`;
    row.querySelector('input').addEventListener('change', e=>{
      if(e.target.checked) selected.add(val); else selected.delete(val);
      renderAll();
    });
    el.appendChild(row);
  });
  const totalSel = selected.size;
  document.getElementById(countId).textContent = totalSel ? totalSel+' sel.' : '';
}

function allValues(dim){
  const set = new Set();
  POINTS.forEach(p=> (dim==='tipo' ? p.tipos : [p[dim]]).forEach(v=>set.add(v)) );
  return [...set].sort((a,b)=>a.localeCompare(b,'pt'));
}

/* ---- map ---- */
let map, boundaryLayer;
let municipioCentroids = {};
let renderBoundaries = function(){}; // no-op fallback if map init fails
try{
map = L.map('map', { zoomControl:false, minZoom:8 });
L.control.zoom({ position:'bottomleft' }).addTo(map);
L.tileLayer(HTTPS + '{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '&copy; OpenStreetMap contributors · limites municipais: IBGE (via geodata-br, CC0)',
  maxZoom: 19,
}).addTo(map);

// Centróides de TODOS os municípios conhecidos (mesmo os sem ponto agora),
// só pra servir de fallback de coordenada — não desenha nada ainda.
L.geoJSON(RMF_GEO).eachLayer(l=>{
  const c = l.getBounds().getCenter();
  municipioCentroids[l.feature.properties.name] = [c.lat, c.lng];
});

boundaryLayer = L.layerGroup().addTo(map);
let boundariesFitted = false;

renderBoundaries = function(){
  boundaryLayer.clearLayers();
  const municipiosComPonto = new Set(POINTS.filter(p=>p.lat!=null).map(p=>p.municipio));
  const feats = RMF_GEO.features.filter(f => municipiosComPonto.has(f.properties.name));
  if(!feats.length) return;
  const layer = L.geoJSON({type:'FeatureCollection', features:feats}, {
    style: feature => {
      const c = MUNI_COLORS[feature.properties.name] || {fill:'#ccc',stroke:'#888'};
      return { fillColor:c.fill, fillOpacity:0.55, color:c.stroke, weight:1.6, opacity:0.9 };
    },
    onEachFeature: (feature, l) => {
      l.bindTooltip(feature.properties.name, {permanent:true, direction:'center', className:'muni-label-tt', opacity:1});
      l.on('mouseover', () => l.setStyle({fillOpacity:0.75, weight:2.6}));
      l.on('mouseout', () => l.setStyle({fillOpacity:0.55, weight:1.6}));
    }
  });
  layer.addTo(boundaryLayer);
  if(!boundariesFitted){
    map.fitBounds(layer.getBounds(), { padding:[30,30] });
    boundariesFitted = true;
  }
};
}catch(err){
  console.error('Falha ao iniciar o mapa:', err);
  const tag = document.getElementById('syncTag');
  if(tag) tag.textContent = 'Erro ao carregar o mapa: ' + err.message;
}

function makeIcon(pending){
  return L.divIcon({ className:'', html:`<div class="eco-pin${pending?' pending':''}">&#9842;</div>`, iconSize:[32,32], iconAnchor:[16,16], popupAnchor:[0,-16] });
}
function routeButtons(p){
  // Prioriza a coordenada exata (agora vem de dado real, não mais estimativa
  // por bairro) — só cai pro endereço em texto se não houver lat/lon.
  const hasCoord = p.lat!=null && p.lon!=null;
  const addressText = [p.endereco, p.bairro, p.municipio, 'CE', 'Brasil'].filter(Boolean).join(', ');
  const dest = hasCoord ? `${p.lat},${p.lon}` : encodeURIComponent(addressText);
  const gmaps = HTTPS + `www.google.com/maps/dir/?api=1&destination=${dest}`;
  const waze = hasCoord
    ? HTTPS + `waze.com/ul?ll=${dest}&navigate=yes`
    : HTTPS + `waze.com/ul?q=${dest}&navigate=yes`;
  return `<div class="routes">
      <a class="gmaps" href="${gmaps}" target="_blank" rel="noopener">Google Maps</a>
      <a class="waze" href="${waze}" target="_blank" rel="noopener">Waze</a>
    </div>`;
}
function popupHtml(p){
  const tags = (p.tipos||[]).map(t=>`<span class="tag" style="background:${CAT_COLORS[t]||'#888'}">${t}</span>`).join('');
  const fotoUrl = driveThumb(p.foto);
  const fotoLink = /^https?:/i.test(p.foto) ? p.foto : fotoUrl;
  const foto = fotoUrl
    ? `<a href="${esc(fotoLink)}" target="_blank" rel="noopener"><img class="popup-photo" src="${esc(fotoUrl)}" alt="Foto de ${esc(p.nome)}" onerror="this.closest('.popup-photo-wrap').style.display='none'"></a>`
    : '';
  return `<div class="popup">
      ${foto ? `<div class="popup-photo-wrap">${foto}</div>` : ''}
      <h3>${esc(p.nome)}</h3>
      <div class="meta">${esc(p.bairro)} — ${esc(p.municipio)}</div>
      <div class="meta">${esc(p.endereco)}</div>
      ${p.horario ? `<div class="meta">🕘 ${esc(p.horario)}</div>` : ''}
      ${tags ? `<div class="tags">${tags}</div>` : ''}
      ${p.lat!=null ? routeButtons(p) : '<div class="meta">Sem coordenada — rota indisponível</div>'}
    </div>`;
}

let markers = [];
function renderMarkers(){
  const total = currentFiltered().length;
  document.getElementById('countBadge').textContent = total + (total===1?' ponto':' pontos');
  if(!map) return; // mapa não inicializou (ver mensagem de erro no canto superior esquerdo)
  markers.forEach(m=>map.removeLayer(m));
  markers = [];
  currentFiltered().forEach(p=>{
    if(p.lat==null) return;
    const marker = L.marker([p.lat,p.lon], {icon:makeIcon(p._pending)});
    marker.bindPopup(popupHtml(p), {maxWidth:270});
    marker.addTo(map);
    markers.push(marker);
  });
}

function renderAll(){
  renderGroup('municipio','list-municipio','cnt-municipio', allValues('municipio'));
  renderGroup('bairro','list-bairro','cnt-bairro', allValues('bairro'));
  renderBoundaries();
  renderMarkers();
}

document.getElementById('clearBtn').addEventListener('click', ()=>{
  state.municipio.clear(); state.bairro.clear(); state.tipo.clear();
  state.q=''; document.getElementById('searchInput').value='';
  renderAll();
});
let searchTimer;
document.getElementById('searchInput').addEventListener('input', e=>{
  clearTimeout(searchTimer);
  const v = e.target.value;
  searchTimer = setTimeout(()=>{ state.q = normalize(v); renderAll(); }, 120);
});

/* ---- load live data straight from the spreadsheet (server-side, no fetch) ---- */
async function loadFromSheet(){
  const tag = document.getElementById('syncTag');
  const btn = document.getElementById('refreshBtn');
  if(btn) btn.classList.add('spinning');
  tag.textContent = 'atualizando…';
  try{
    const rows = await runServer('getPoints');
    if(!rows || !rows.length) throw new Error('planilha vazia');
    POINTS = rowsToPoints(rows);
    const now = new Date();
    tag.textContent = 'atualizado às ' + now.toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
  }catch(err){
    console.warn('Não foi possível carregar a planilha ao vivo, usando dados salvos:', err);
    tag.textContent = 'usando última cópia salva (offline)';
  }
  if(btn) btn.classList.remove('spinning');
  renderAll();
}

// Atualiza sozinho a cada 60s (enquanto a página estiver aberta) e também
// quando a aba volta a ficar visível, além do botão manual.
document.getElementById('refreshBtn').addEventListener('click', loadFromSheet);
setInterval(loadFromSheet, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) loadFromSheet(); });

        <div class="hint">Deixe em branco para usar a localização aproximada do bairro/município.</div>
        <div class="field">
          <label for="fFoto">Link da foto (Google Drive, opcional)</label>
          <input id="fFoto" placeholder="https://drive.google.com/file/d/...">
          <div class="hint">No Drive: botão direito no arquivo → Compartilhar → mude para "Qualquer pessoa com o link" → copie o link aqui.</div>
        </div>
        <div class="error-msg" id="formError"></div>
        <div class="modal-actions">
          <button class="btn ghost" id="formCancel">Cancelar</button>
          <button class="btn primary" id="formSubmit">Adicionar</button>
        </div>
      </div>
    </div>`;
  const backdrop = document.getElementById('backdrop');
  backdrop.addEventListener('click', e=>{ if(e.target===backdrop) closeModal(); });
  document.getElementById('formCancel').addEventListener('click', closeModal);
  document.getElementById('formSubmit').addEventListener('click', submitNewPoint);
}

async function submitNewPoint(){
  const municipio = document.getElementById('fMuni').value.trim();
  const bairro = document.getElementById('fBairro').value.trim();
  const nome = document.getElementById('fNome').value.trim();
  const endereco = document.getElementById('fEndereco').value.trim();
  const latStr = document.getElementById('fLat').value.trim();
  const lonStr = document.getElementById('fLon').value.trim();
  const errEl = document.getElementById('formError');

  if(!municipio || !bairro || !nome || !endereco){
    errEl.textContent = 'Preencha todos os campos obrigatórios.';
    return;
  }

  let lat = latStr ? parseFloat(latStr.replace(',','.')) : null;
  let lon = lonStr ? parseFloat(lonStr.replace(',','.')) : null;
  if(lat==null || lon==null || isNaN(lat) || isNaN(lon)){
    const coord = lookupCoord(municipio, bairro);
    lat = coord ? coord[0] : null;
    lon = coord ? coord[1] : null;
  }

  const foto = document.getElementById('fFoto').value.trim();
  const payload = {
    password: addPassword,
    municipio, bairro, nome, endereco,
    coordenadas: (lat!=null && lon!=null) ? `${lat}, ${lon}` : '',
    foto,
  };
  const submitBtn = document.getElementById('formSubmit');
  submitBtn.disabled = true;
  submitBtn.textContent = 'Salvando...';

  let saved = false;
  try{
    await runServer('addPoint', payload);
    saved = true;
  }catch(err){
    console.error('Falha ao gravar na planilha:', err);
    errEl.textContent = 'Não foi possível salvar na planilha agora. O ponto foi adicionado só nesta sessão.';
  }

  POINTS.push({
    municipio, bairro, nome, endereco,
    tipos_raw: '', tipos: [], horario: '', foto,
    lat, lon, _pending: !saved,
  });
  closeModal();
  showToast(saved ? 'Ponto adicionado e enviado à planilha.' : 'Ponto adicionado nesta sessão (não sincronizado).');
  renderAll();
}

document.getElementById('openAddBtn').addEventListener('click', openPasswordStep);

/* ---- alternar layout desktop / mobile manualmente ---- */
const viewToggleBtn = document.getElementById('viewToggleBtn');
function applyViewMode(mode){
  document.body.classList.remove('force-desktop','force-mobile');
  if(mode) document.body.classList.add('force-' + mode);
  viewToggleBtn.textContent = mode === 'mobile' ? '📱' : '🖥️';
  viewToggleBtn.title = mode === 'mobile'
    ? 'Layout mobile forçado — clique para voltar ao automático/desktop'
    : (mode === 'desktop' ? 'Layout desktop forçado — clique para ver no mobile' : 'Alternar layout desktop/mobile');
}
let viewMode = null; // null = automático (segue o tamanho real da tela)
viewToggleBtn.addEventListener('click', ()=>{
  viewMode = viewMode === 'mobile' ? 'desktop' : (viewMode === 'desktop' ? null : 'mobile');
  applyViewMode(viewMode);
});

/* ---- boot ---- */
renderAll();
loadFromSheet();
}catch(err){
  console.error('Erro geral na página:', err);
  var tag = document.getElementById('syncTag');
  if(tag) tag.textContent = 'Erro: ' + err.message;
}
</script>
